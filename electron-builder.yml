appId: io.opencinna.desktop
productName: Cinna Desktop
directories:
  buildResources: build
files:
  - '!**/.vscode/*'
  - '!src/*'
  - '!electron.vite.config.{js,ts,mjs,cjs}'
  - '!{.eslintcache,eslint.config.mjs,.prettierignore,.prettierrc.yaml,dev-app-update.yml,CHANGELOG.md,README.md}'
  - '!{.env,.env.*,.npmrc,pnpm-lock.yaml}'
  - '!{tsconfig.json,tsconfig.node.json,tsconfig.web.json}'
  # The kit contract ships via extraResources below, not inside the asar.
  # Without this it would be packed twice: once here (and unpacked again by
  # asarUnpack) and once as an extra resource.
  - '!resources/cinna-kit-contract/**'
  # **The Claude Agent SDK's bundled `claude`, which we must never ship.**
  #
  # `@anthropic-ai/claude-agent-sdk` declares eight optional platform packages,
  # one per target, and each is a single ~190 MB `claude` executable. We drive
  # the binary the *user* installed — `pathToClaudeCodeExecutable` always points
  # at what `toolDetectionService` found — so the bundled copy is never
  # executed. But not executing it is not the same as not shipping it: npm
  # installs it from the dependency alone, and without this line every installer
  # grows by ~190 MB and carries a second Claude Code the user never chose,
  # cannot see and cannot update.
  #
  # Verified safe to drop: with the platform package deleted outright, the SDK
  # still imports and runs a full turn, because the bundled-binary resolution
  # path is only reached when `pathToClaudeCodeExecutable` is absent. See
  # `docs/agents/local_agents/claude_contract.md` §5a.
  - '!node_modules/@anthropic-ai/claude-agent-sdk-*/**'
  # …and the same binary again under `@agentclientprotocol/claude-agent-acp`,
  # which pins its own SDK copy (nested, not hoisted). The ACP launcher always
  # sets `CLAUDE_CODE_EXECUTABLE` to the user's `claude`, so that copy is never
  # executed either.
  - '!node_modules/**/node_modules/@anthropic-ai/claude-agent-sdk-*/**'
  # Codex is always supplied by CODEX_PATH; exclude the unused bundled CLI.
  - '!node_modules/@openai/codex*/**'
  - '!node_modules/**/node_modules/@openai/codex*/**'
asarUnpack:
  # For the icon PNGs, which are imported with electron-vite's `?asset`.
  # The kit contract is excluded from `files` above, so this never matches it.
  - resources/**
  # **The Claude ACP adapter, which is executed as a child process.** The
  # launcher spawns `<this app> --as-node <adapter>/dist/index.js`, and the
  # child reads that file with its own `fs`: a path inside `app.asar` is a file
  # to Electron's patched reader and to nothing else. Unpacked, it is a real
  # path on disk. The `files` exclusion above keeps its nested
  # `claude-agent-sdk-*` platform package — another ~190 MB `claude` — out of
  # the unpacked copy; `CLAUDE_CODE_EXECUTABLE` is what makes that safe.
  - node_modules/@agentclientprotocol/claude-agent-acp/**
  - node_modules/@agentclientprotocol/codex-acp/**
extraResources:
  # The kit contract is read as a *tree* at runtime — the manifest schema,
  # layout.json, and the templates the scaffolder copies file by file — so it
  # ships as a real directory at Resources/cinna-kit-contract, with no asar shim
  # in the read path. In development the same tree is read straight from the
  # repo. Both paths live in src/main/kit/contractStore.ts; read the packaging
  # note there before changing any of this.
  - from: resources/cinna-kit-contract
    to: cinna-kit-contract
# The `cinna://` deep link the server-hosted landing page fires. electron-builder
# turns this into the macOS bundle's CFBundleURLTypes, the Linux .desktop file's
# `MimeType=x-scheme-handler/cinna`, and the NSIS registry keys on Windows.
# A `.deb` registers the handler on install; an AppImage only does so with
# AppImageLauncher present, which is why the landing page keeps a
# paste-the-URL fallback.
protocols:
  - name: Cinna Desktop
    schemes:
      - cinna
win:
  executableName: cinna-desktop
nsis:
  artifactName: ${name}-${version}-setup.${ext}
  shortcutName: ${productName}
  uninstallDisplayName: ${productName}
  createDesktopShortcut: always
mac:
  category: public.app-category.productivity
  artifactName: ${name}-${version}-${arch}-mac.${ext}
  hardenedRuntime: true
  gatekeeperAssess: false
  entitlements: build/entitlements.mac.plist
  entitlementsInherit: build/entitlements.mac.plist
  extendInfo:
    - NSCameraUsageDescription: Application requests access to the device's camera.
    - NSMicrophoneUsageDescription: Application requests access to the device's microphone.
    # Shown inside the system's Files-and-Folders prompt, under the app name. It
    # is the only explanation the user gets if the prompt ever arrives ahead of
    # the app's own — so it names the folder and says why it exists, rather than
    # electron-vite's default, which reads like a demand from nowhere. The
    # in-app explainer that normally comes first lives in `homeAccessService`.
    - NSDocumentsFolderUsageDescription: Cinna keeps each of your agents in its own folder under Documents/CinnaAgents, so you can open them in an editor and keep them when you reinstall.
    - NSDownloadsFolderUsageDescription: Cinna saves files you download from a chat to your Downloads folder.
    - NSAppleEventsUsageDescription: Cinna needs to control Terminal or iTerm to open a terminal in your agent folder.
  notarize: true
  target:
    - target: dmg
      arch: [x64, arm64]
    - target: zip
      arch: [x64, arm64]
dmg:
  artifactName: ${name}-${version}-${arch}.${ext}
linux:
  target:
    - target: AppImage
      arch: [x64]
    - target: deb
      arch: [x64]
  maintainer: Evgenii Leksunin <evgeny-l@opencinna.io>
  category: Utility
  synopsis: Desktop client for remote agents (MCP, A2A, OpenCinna)
appImage:
  artifactName: ${name}-${version}-${arch}.${ext}
deb:
  artifactName: ${name}-${version}-${arch}.${ext}
npmRebuild: false
publish:
  provider: github
  owner: opencinna
  repo: cinna-desktop
  releaseType: draft
