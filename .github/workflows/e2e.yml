name: Tests

# Unit suite, typecheck and the Playwright E2E suite against the built app.
# macOS first: it matches the product, needs no display server, and
# safeStorage is real there. The E2E suite sandboxes HOME and userData per
# test, so a runner's own profile is never touched.
#
# Specs that need a live model read OPENAI_API_KEY and skip without it; the
# secret is passed only for pushes to main, never for pull requests.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - run: npm run typecheck

      - run: npm test

      # The engine binary the app pins, downloaded once through the app by the
      # E2E global setup and reused across runs. Keyed on the file that pins it.
      - name: Cache the pinned engine
        uses: actions/cache@v4
        with:
          path: ~/.cache/cinna-e2e/engine
          key: cinna-e2e-engine-${{ runner.os }}-${{ hashFiles('src/shared/engine.ts') }}

      - name: E2E against the built app
        env:
          OPENAI_API_KEY: ${{ github.event_name != 'pull_request' && secrets.OPENAI_API_KEY || '' }}
        run: npm run test:e2e

      - name: Keep traces and screenshots of failures
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-test-results
          path: e2e/test-results
          if-no-files-found: ignore
